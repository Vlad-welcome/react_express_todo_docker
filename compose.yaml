services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"     # наружу 8080, внутри Express на 3000
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: "1234"
      DB_NAME: mydata
    restart: on-failure
  
  db:
    image: postgres:18.6-alpine
    container_name: psgr
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: mydata
    volumes:
      - pgdata:/var/lib/postgresql   # для PG 18 путь без /data

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    restart: on-failure

volumes:
  pgdata:

