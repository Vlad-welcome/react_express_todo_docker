services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"     # наружу 8080, внутри Express на 3000
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: "1234"
      DB_NAME: mydata
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:18.6-alpine
    container_name: psgr
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: mydata
    volumes:
      - pgdata:/var/lib/postgresql   # для PG 18 путь без /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

